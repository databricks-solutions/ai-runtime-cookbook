# Knowledge distillation on one H100: a 7B teacher generates math solutions with vLLM, and a
# 0.5B student is fine-tuned on the correct ones with TRL.
# Run from this directory: databricks air run -f workload.yaml --watch

experiment_name: air-distill-qwen25-7b-to-05b

environment:
  version: "5"
  dependencies:
    - vllm==0.33.0
    # vLLM 0.33 needs transformers < 5.21.
    - transformers==5.20.2
    - trl==1.17.1
    - accelerate==1.15.0
    # The environment's huggingface_hub breaks load_dataset with newer fsspec releases
    # ("HfFileSystem.find() got multiple values for keyword argument 'maxdepth'").
    # These versions work together.
    - datasets==5.2.0
    - huggingface_hub==2.4.0
    - fsspec==2026.9.0
    - mlflow-skinny==3.8.1
    # vllm needs opencv-python-headless>=4.13. Its manylinux_2_28 wheels bundle an
    # OpenSSL build that aborts with "FATAL FIPS SELFTEST FAILURE" on AI Runtime,
    # so pin the x86_64 manylinux2014 wheel, which bundles a compatible OpenSSL.
    - opencv-python-headless@https://files.pythonhosted.org/packages/de/06/14c8c5d331bc72738683a9b227966aceaa4c6d08752f33d64578aebcb6f8/opencv_python_headless-4.14.0.94-cp37-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xH100

code_source:
  root_path: .

env_variables:
  # Use vLLM's PyTorch sampler. The default FlashInfer sampler JIT-compiles a CUDA
  # kernel at startup and needs CUDA headers (curand.h) that this environment lacks.
  VLLM_USE_FLASHINFER_SAMPLER: "0"

command: |
  # AIR may inherit this obsolete setting; Hub 1.x and later use Xet for downloads.
  unset HF_HUB_ENABLE_HF_TRANSFER
  bash "$CODE_SOURCE_PATH/run.sh"

max_retries: 0
timeout_minutes: 90

parameters:
  teacher_model: Qwen/Qwen2.5-7B-Instruct   # public; no Hugging Face token needed
  student_model: Qwen/Qwen2.5-0.5B-Instruct
  num_train_questions: 4000
  samples_per_question: 4      # keep the first correct one per question
  max_tokens: 768
  num_eval_questions: 500
  epochs: 2
  batch_size: 16
  learning_rate: 0.00001
  # Requires access to this existing volume; replace it with another writable volume if needed.
  output_root: /Volumes/main/default/air_examples/distillation-teacher-vllm-student-trl
