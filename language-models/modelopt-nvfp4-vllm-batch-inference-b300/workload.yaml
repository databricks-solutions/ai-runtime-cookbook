# Quantize Qwen3-32B to NVFP4 (4-bit) with NVIDIA Model Optimizer, then compare vLLM batch
# inference throughput and GSM8K accuracy against bf16 on B300.
# Run from this directory: databricks air run -f workload.yaml --watch

experiment_name: air-modelopt-nvfp4-vllm-b300

environment:
  # B300 requires environment version 6 or later.
  version: databricks_ai_v6
  dependencies:
    - vllm==0.33.0
    - nvidia-modelopt[hf]==0.48.0
    # Satisfies both vLLM (<5.21) and Model Optimizer (<5.19).
    - transformers==5.18.0
    - datasets==5.2.0
    - huggingface_hub==2.4.0
    - fsspec==2026.9.0
    # vllm needs opencv-python-headless>=4.13. Its manylinux_2_28 wheels bundle an
    # OpenSSL build that aborts with "FATAL FIPS SELFTEST FAILURE" on AI Runtime,
    # so pin the x86_64 manylinux2014 wheel, which bundles a compatible OpenSSL.
    - opencv-python-headless@https://files.pythonhosted.org/packages/de/06/14c8c5d331bc72738683a9b227966aceaa4c6d08752f33d64578aebcb6f8/opencv_python_headless-4.14.0.94-cp37-abi3-manylinux2014_x86_64.manylinux_2_17_x86_64.whl

compute:
  accelerator_type: GPU_8xB300
  num_accelerators: 8   # the recipe uses 2 GPUs; B300 is only offered as a full node

code_source:
  root_path: .

command: |
  # AIR may inherit this obsolete setting; Hub 1.x and later use Xet for downloads.
  unset HF_HUB_ENABLE_HF_TRANSFER
  # The environment's flash-attn is compiled for its original PyTorch, which vllm replaces.
  # vLLM ships its own attention kernels, so remove the incompatible package.
  python -m pip uninstall -y flash-attn
  bash "$CODE_SOURCE_PATH/run.sh"

max_retries: 0
timeout_minutes: 90

parameters:
  # Qwen3-8B also runs, but NVFP4 was slower than bf16 at that size.
  model_name: Qwen/Qwen3-32B  # public; no Hugging Face token needed
  quant_format: nvfp4         # quantize.py also accepts fp8, which hasn't been validated
  calib_samples: 256
  calib_seq_len: 1024
  quantized_dir: /tmp/qwen3-quantized
  num_prompts: 1319           # the full GSM8K test set
  max_tokens: 1024
  # Requires access to this existing volume; replace it with another writable volume if needed.
  output_root: /Volumes/main/default/air_examples/modelopt-nvfp4-vllm-batch-inference-b300
