experiment_name: long-context-sft-ulysses-sequence-parallel-8xh100

# Environment v6: it preinstalls PyTorch 2.11 and flash-attn, which the Ulysses sequence
# split uses for its attention kernel. v5 has no preinstalled PyTorch.
environment:
  version: databricks_ai_v6
  dependencies:
    - accelerate==1.16.0
    - deepspeed==0.20.0
    - mlflow-skinny==3.8.1

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

code_source:
  root_path: .

env_variables:
  HF_HOME: /tmp/hf
  PYTORCH_ALLOC_CONF: "expandable_segments:True"

command: |
  set -eo pipefail
  # AIR may inherit this obsolete setting; Hub 1.x uses Xet for downloads.
  unset HF_HUB_ENABLE_HF_TRANSFER
  cd "$CODE_SOURCE_PATH"
  python -u sweep.py

max_retries: 0
timeout_minutes: 120

parameters:
  # Requires access to this existing volume; replace it with another writable volume if needed.
  output_root: /Volumes/main/default/air_examples/long-context-sft-ulysses-sequence-parallel-8xh100
  model_name: Qwen/Qwen3-8B
  dataset_name: zai-org/LongAlign-10k
  # Sequence lengths in tokens, comma-separated. Each must be divisible by the SP degree.
  # SP=8 runs all 8 GPUs on one sequence. SP=1 runs one sequence per GPU (data parallel).
  sp8_seq_lens: "16384,65536,131072"
  sp1_seq_lens: "16384,32768,65536"
  # Optimizer steps per point that are timed, after one untimed warm-up step.
  steps: 3
  learning_rate: 0.00001
  # One point is killed and recorded as "timeout" if it runs longer than this.
  point_timeout_minutes: 15
