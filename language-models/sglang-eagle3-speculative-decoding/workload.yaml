# SGLang offline batch inference with EAGLE-3 speculative decoding on one H100.
# Run from this directory: databricks air run -f workload.yaml --watch

experiment_name: air-sglang-eagle3-qwen3-8b

environment:
  # CUDA 13 environment, matching the CUDA 13 wheels that SGLang 0.5.23 ships.
  version: databricks_ai_v6
  dependencies:
    - sglang==0.5.23
    # SGLang's tokenizers pin needs huggingface_hub < 2; these versions work together with it.
    - datasets==4.8.5
    - huggingface_hub==1.33.0
    - fsspec==2026.2.0

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xH100

code_source:
  root_path: .

command: |
  # AIR may inherit this obsolete setting; Hub 1.x uses Xet for downloads.
  unset HF_HUB_ENABLE_HF_TRANSFER
  set -eo pipefail
  # The environment's flash-attn is compiled for its original PyTorch, which sglang replaces.
  # SGLang ships its own attention kernels, so remove the incompatible package.
  python -m pip uninstall -y flash-attn
  # The environment's legacy pynvml package shadows nvidia-ml-py's newer pynvml module.
  python -m pip uninstall -y pynvml
  python -m pip install --no-deps --force-reinstall nvidia-ml-py==13.615.71
  python "$CODE_SOURCE_PATH/batch_inference.py"

max_retries: 0
timeout_minutes: 60

parameters:
  model_name: Qwen/Qwen3-8B                    # public; no Hugging Face token needed
  draft_model_name: AngelSlim/Qwen3-8B_eagle3  # public EAGLE-3 draft head for Qwen3-8B
  num_prompts: 256
  max_new_tokens: 512
  # Speculative decoding helps most when the GPU is not saturated (latency-bound serving).
  max_running_requests: 8
  speculative_num_steps: 3
  speculative_eagle_topk: 1
  speculative_num_draft_tokens: 4
  # Requires access to this existing volume; replace it with another writable volume if needed.
  output_root: /Volumes/main/default/air_examples/sglang-eagle3-speculative-decoding
