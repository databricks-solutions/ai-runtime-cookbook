experiment_name: air-recommendation-dlrm

environment:
  version: "5"
  dependencies:
    - torch==2.8.0
    - fbgemm-gpu==1.3.0
    - torchrec==1.3.0
    - torchmetrics==1.0.3

# 4 A10 nodes with one GPU each. torchrun starts one rank per GPU, and TorchRec shards the
# embedding tables across all ranks.
compute:
  num_accelerators: 4
  accelerator_type: GPU_1xA10

code_source:
  root_path: .

command: |
  cd "$CODE_SOURCE_PATH"
  torchrun \
    --nnodes="$NUM_NODES" \
    --node_rank="$NODE_RANK" \
    --nproc_per_node="${LOCAL_WORLD_SIZE:-1}" \
    --master_addr="$MASTER_ADDR" \
    --master_port="$MASTER_PORT" \
    train.py

env_variables:
  NCCL_SOCKET_IFNAME: eth0

max_retries: 0
timeout_minutes: 30

parameters:
  dataset_repo: criteo/CriteoClickLogs
  train_day: day=2015-02-15
  eval_day: day=2015-02-16  # validation and test come from the following day
  train_files: 32           # 0.8M-1.5M rows each, split across ranks; must be at least the number of ranks
  validation_files: 1
  test_files: 1
  data_root: /tmp/recommendation-dlrm
  # Requires access to this existing volume; replace it with another writable volume if needed.
  output_root: /Volumes/main/default/air_examples/recommendation-dlrm
  hash_size: 1000000        # rows per embedding table; 26 tables x 64 dims is about 7 GB
  embedding_dim: 64
  dense_arch_layer_sizes: [512, 256, 64]  # last size must equal embedding_dim
  over_arch_layer_sizes: [512, 256, 1]
  batch_size: 8192          # per rank
  learning_rate: 0.02
  eps: 0.00000001
  epochs: 1
  max_train_steps: -1       # set to a positive number for a quick run
  log_every_steps: 20
  eval_every_steps: 200
  seed: 42
