experiment_name: ray-data-audio-transcription-diarization

environment:
  version: "5"
  dependencies:
    - ray[data]==2.56.1
    # pyannote.audio 3.3.2 uses torchaudio.AudioMetaData, removed in newer
    # torchaudio; pin the torch/torchaudio pair (and hub) to a validated set.
    - torch==2.7.1
    - torchaudio==2.7.1
    - faster-whisper==1.1.1
    - pyannote.audio==3.3.2
    - huggingface_hub==0.29.3
    - soundfile
    - datasets==3.2.0
    - hf_transfer
    - fsspec>=2024.6.1

# One 8xH100 node; Ray Data runs one ASR+diarization actor per GPU. Increase
# num_accelerators to add nodes — ray_bootstrap.sh forms the multi-node cluster.
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: .

command: |
  cd "$CODE_SOURCE_PATH"
  RAY_ENTRYPOINT=transcribe_diarize.py bash ray_bootstrap.sh

max_retries: 0
timeout_minutes: 60

# pyannote/speaker-diarization-3.1 is gated. Replace with a Databricks secret
# (scope/key) holding a Hugging Face token that has accepted the model's terms.
secrets:
  HF_TOKEN: 'my_scope/hf_token'

env_variables:
  NCCL_SOCKET_IFNAME: eth0
  NUM_CLIPS: '24'
  # Shared UC volume paths. Replace with writable volumes that already exist;
  # INPUT_DIR holds the staged WAVs, OUTPUT_PATH the result Parquet.
  INPUT_DIR: /Volumes/main/default/air_examples/voxconverse_wavs
  OUTPUT_PATH: /Volumes/main/default/air_examples/audio_diarization_results
