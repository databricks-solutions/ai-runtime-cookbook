experiment_name: ray-data-hello-world

environment:
  version: "5"
  dependencies:
    - "ray[data]==2.56.1"

compute:
  num_accelerators: 2
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - ray_bootstrap.sh
      - data

command: |
  cd "$CODE_SOURCE_PATH"
  RAY_ENTRYPOINT=data/hello_world.py bash ray_bootstrap.sh

max_retries: 0
timeout_minutes: 15
