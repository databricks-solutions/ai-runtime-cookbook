experiment_name: ray-tune-qwen-lora

environment:
  version: "databricks_ai_v5"
  dependencies:
    - peft==0.17.0
    - fsspec==2026.6.0

compute:
  num_accelerators: 4
  accelerator_type: GPU_1xA10

code_source:
  root_path: .

command: |
  cd "$CODE_SOURCE_PATH"
  RAY_ENTRYPOINT=tune.py bash ray_bootstrap.sh

max_retries: 0
timeout_minutes: 45

env_variables:
  NCCL_SOCKET_IFNAME: eth0
  HF_HOME: /tmp/hf
