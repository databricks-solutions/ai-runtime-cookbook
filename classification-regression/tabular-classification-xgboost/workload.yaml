experiment_name: air-tabular-classification-xgboost

environment:
  version: '5'
  dependencies:
    - xgboost==3.0.4
    - scikit-learn==1.6.1

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10   # A10 is the cheapest here

code_source:
  root_path: .

command: |
  set -eo pipefail
  python $CODE_SOURCE_PATH/train.py
  python $CODE_SOURCE_PATH/load_check.py

max_retries: 0
timeout_minutes: 30

parameters:
  # Unity Catalog model-registry target. Set these to an existing schema where you have
  # USE CATALOG, USE SCHEMA, and CREATE MODEL; the recipe does not create schemas.
  uc_catalog: main
  uc_schema: default
  registered_model_name: xgboost_covertype
  # Data and split. The split is deterministic (test_size + random_state) so a downstream
  # batch-inference job can reproduce the identical held-out set.
  test_size: 0.2
  random_state: 42
  # XGBoost hyperparameters.
  n_estimators: 200
  max_depth: 8
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  # Compute device for XGBoost: "cuda" uses the attached GPU_1xA10.
  device: cuda
