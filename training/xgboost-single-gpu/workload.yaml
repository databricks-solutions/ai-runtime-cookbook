experiment_name: air-xgboost-covertype

environment:
  version: "5"
  dependencies:
    - xgboost==3.0.4
    - scikit-learn==1.6.1

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  root_path: .

command: python "$CODE_SOURCE_PATH/train.py"

max_retries: 0
timeout_minutes: 30

parameters:
  # Optional: a fully qualified model name in an existing, writable UC schema.
  # A nonempty value registers a new model version on each run.
  registered_model_name: ""
  test_size: 0.2
  validation_size: 0.2  # Fraction of the remaining 80%; overall split is 64/16/20.
  max_samples: -1       # Training rows only; -1 uses all. Test/validation stay unchanged.
  random_state: 42
  n_estimators: 500
  early_stopping_rounds: 30
  max_depth: 8
  learning_rate: 0.1
  subsample: 0.8
  colsample_bytree: 0.8
  device: cuda
