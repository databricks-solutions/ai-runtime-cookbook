experiment_name: air-modernbert-agnews-ddp

environment:
  version: '5'
  dependencies:
    - transformers==5.16.1
    - datasets==5.0.1
    - accelerate==1.15.0
    - huggingface_hub==1.30.0
    - scikit-learn==1.6.1
    - fsspec==2026.6.0

# 8 GPUs on one node. torchrun (below) starts one process per GPU and the HF Trainer runs DDP.
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: .

# Launch under torchrun so each GPU gets a rank; AIR provides NUM_NODES / NODE_RANK / MASTER_ADDR /
# MASTER_PORT / LOCAL_WORLD_SIZE (so the same command also scales to multiple nodes).
command: |
  cd $CODE_SOURCE_PATH
  torchrun \
    --nnodes="$NUM_NODES" \
    --node_rank="$NODE_RANK" \
    --nproc_per_node="${LOCAL_WORLD_SIZE:-8}" \
    --master_addr="$MASTER_ADDR" \
    --master_port="$MASTER_PORT" \
    train.py

env_variables:
  NCCL_SOCKET_IFNAME: eth0

max_retries: 0
timeout_minutes: 45

parameters:
  # Unity Catalog model-registry target. The schema is auto-created if you have CREATE on the
  # catalog; otherwise create it first or point these at an existing schema you can write to.
  uc_catalog: main
  uc_schema: default
  registered_model_name: modernbert_agnews
  # Model and data (both public; no Hugging Face token needed).
  model_name: answerdotai/ModernBERT-base
  dataset_name: fancyzhx/ag_news
  max_length: 256
  max_train_samples: -1      # -1 = full split; multi-GPU exists to train at scale
  max_eval_samples: -1
  attn_implementation: sdpa  # or "flash_attention_2" with a matching flash-attn build
  # Training hyperparameters (per-device batch sizes; decimal LR so YAML parses it as a float).
  epochs: 2
  train_batch_size: 64
  eval_batch_size: 128
  learning_rate: 0.00005
  weight_decay: 0.01
  warmup_steps: 0.1          # float in [0,1) = ratio of total steps
  seed: 42
