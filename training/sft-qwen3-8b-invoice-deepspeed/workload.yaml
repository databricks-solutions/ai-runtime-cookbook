experiment_name: sft-qwen3-8b-invoice-deepspeed

environment:
  version: '5'
  dependencies:
    # Pinned to a validated pair: transformers 5.x removed `warmup_ratio`,
    # and trl 1.13.0 is the release verified against transformers 5.17.0.
    - trl==1.13.0
    - transformers==5.17.0
    - accelerate
    - datasets
    - deepspeed
    - mlflow

# Full-weight SFT of an 8B model with DeepSpeed ZeRO-3 fits on one 8xH100 node.
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

code_source:
  type: snapshot
  snapshot:
    root_path: .

command: |
  cd $CODE_SOURCE_PATH
  torchrun --nproc_per_node="${LOCAL_WORLD_SIZE:-8}" train.py

max_retries: 1
timeout_minutes: 240

parameters:
  # --- Output location (Unity Catalog Volume) ---
  # Requires access to this existing volume; replace it with another writable
  # volume if needed, and pass the same path to prep_data.py. Datasets are read
  # from <output_root>/data; checkpoints and the final model are written under
  # <output_root>/<MLFLOW_RUN_ID> so reruns don't overwrite each other.
  output_root: /Volumes/main/default/air_examples/sft-qwen3-8b-invoice-deepspeed

  # --- Model + training hyperparameters ---
  model_name: Qwen/Qwen3-8B
  learning_rate: 0.00001
  num_epochs: 3
  max_seq_length: 4096
  per_device_batch_size: 2
  gradient_accumulation_steps: 2
  # transformers 5.x removed `warmup_ratio`; warm up by step count instead. For a
  # very small max_steps smoke test, lower this too, or the whole run stays in LR
  # warmup (near-zero learning rate) and the loss curve looks misleadingly flat.
  warmup_steps: 20
  # Cap total steps for a quick end-to-end smoke test (shrinks data + bounds
  # steps so train -> eval -> save finishes in ~4 min). -1 = full num_epochs run.
  max_steps: -1
