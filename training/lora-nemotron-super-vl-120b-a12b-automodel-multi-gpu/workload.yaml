# Nemotron Super VL LoRA fine-tuning with NVIDIA NeMo AutoModel on one 8x H100 node.
# Run from this directory: databricks air run -f workload.yaml

experiment_name: air-nemotron-super-vl-cord-lora

mlflow_run_name: fifty-step-vl-lora-demo

environment:
  # Custom NeMo AutoModel container with native Super VL support, referenced by its
  # Unity Catalog coordinates (<catalog>.<schema>.<image>:<tag>). Stock
  # nemo-automodel:26.08.00 lacks Super VL, so build and push this image once
  # before the first run (see README "Before you run"):
  #   docker build --platform linux/amd64 -t nemo-automodel-vl:26.08.00 .
  #   databricks air images push -s nemo-automodel-vl:26.08.00 \
  #     --catalog main --schema default --artifact nemo-automodel-vl:26.08.00
  unity_catalog_image: main.default.nemo-automodel-vl:26.08.00

compute:
  accelerator_type: GPU_8xH100
  num_accelerators: 8

code_source:
  root_path: .
  include_paths:
    - train.sh
    - nemotron_cord_v2.yaml

env_variables:
  # Local-disk checkpoint and Hugging Face cache locations on the AIR node.
  CHECKPOINT_ROOT: /local_disk0/nemotron-super-vl-air/checkpoints
  HF_HOME: /local_disk0/nemotron-super-vl-air/huggingface
  # Durable copy of the final LoRA adapter. Requires access to this existing
  # volume; replace it with another writable volume if needed.
  ADAPTER_OUTPUT_ROOT: /Volumes/main/default/air_examples/lora-nemotron-3.5-super-vl-120b-a12b-automodel-multi-gpu
  MLFLOW_TRACKING_URI: databricks
  MLFLOW_ENABLE_DB_SDK: "false"
  TORCHINDUCTOR_COMPILE_THREADS: "1"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  OPENSSL_FORCE_FIPS_MODE: "0"

timeout_minutes: 240

max_retries: 0

command: |
  bash "$CODE_SOURCE_PATH/train.sh"
