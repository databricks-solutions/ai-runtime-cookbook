<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Chest X-ray DICOM throughput on one A10 GPU</title>
  <desc id="desc">Both pipelines scored the same 10,000 synthetic images. The Ray Data baseline processed 73.033 images per second. UCVolumeDataset processed 108.356 on the first pass and 932.690 on the pass that reused cached files and wrote Parquet predictions.</desc>
  <rect width="1200" height="760" fill="#F9F7F4"/>
  <style>
    text { font-family: "DM Sans", Arial, sans-serif; letter-spacing: 0; }
    .navy { fill: #0B2026; }
    .muted { fill: #526066; }
    .lava { fill: #FF3621; }
    .label { font-size: 20px; font-weight: 600; }
    .small { font-size: 17px; }
  </style>

  <text x="48" y="62" class="navy" font-size="38" font-weight="700">Chest X-ray DICOM throughput on one A10 GPU</text>
  <text x="48" y="94" class="muted" font-size="20">Databricks AI Runtime · TorchXRayVision · 10,000 synthetic 512 × 512 images</text>

  <rect x="48" y="124" width="1104" height="244" rx="8" fill="#FFFFFF" stroke="#D7D3CC"/>
  <text x="80" y="162" class="navy" font-size="22" font-weight="700">Images per second</text>

  <text x="80" y="208" class="navy label">Ray Data baseline</text>
  <rect x="410" y="189" width="575" height="24" rx="4" fill="#E5E7EB"/>
  <rect x="410" y="189" width="45" height="24" rx="4" fill="#7A858A"/>
  <text x="1112" y="208" class="navy label" text-anchor="end">73.033</text>

  <text x="80" y="252" class="navy label">UCVolumeDataset · cold pass</text>
  <rect x="410" y="233" width="575" height="24" rx="4" fill="#E5E7EB"/>
  <rect x="410" y="233" width="67" height="24" rx="4" fill="#4B7579"/>
  <text x="1112" y="252" class="navy label" text-anchor="end">108.356</text>

  <text x="80" y="296" class="navy label">UCVolumeDataset · warm pass</text>
  <rect x="410" y="277" width="575" height="24" rx="4" fill="#FF3621"/>
  <text x="1112" y="296" class="navy label" text-anchor="end">932.690</text>

  <text x="80" y="350" class="lava" font-size="26" font-weight="700">Warm pass at 12.8× baseline</text>
  <text x="1112" y="348" class="navy small" text-anchor="end">99% median GPU utilization | 100% p95 | 6.37 GB GPU memory</text>

  <text x="48" y="410" class="navy" font-size="24" font-weight="700">What changed</text>

  <rect x="48" y="434" width="252" height="184" rx="8" fill="#FFFFFF" stroke="#D7D3CC"/>
  <text x="68" y="476" class="navy" font-size="20" font-weight="700">UCVolumeDataset</text>
  <text x="68" y="518" class="muted small">Files are cached locally.</text>
  <text x="68" y="545" class="muted small">Twelve loader workers</text>
  <text x="68" y="572" class="muted small">decode and prefetch.</text>

  <rect x="324" y="434" width="252" height="184" rx="8" fill="#FFFFFF" stroke="#D7D3CC"/>
  <text x="344" y="476" class="navy" font-size="20" font-weight="700">GPU preprocessing</text>
  <text x="344" y="518" class="muted small">Windowing, normalization,</text>
  <text x="344" y="545" class="muted small">inversion, and resizing</text>
  <text x="344" y="572" class="muted small">run in batches on the GPU.</text>

  <rect x="600" y="434" width="252" height="184" rx="8" fill="#FFFFFF" stroke="#D7D3CC"/>
  <text x="620" y="476" class="navy" font-size="20" font-weight="700">Two CUDA streams</text>
  <text x="620" y="518" class="muted small">Two model copies score</text>
  <text x="620" y="545" class="muted small">batches of 256 using FP16</text>
  <text x="620" y="572" class="muted small">and channels-last tensors.</text>

  <rect x="876" y="434" width="252" height="184" rx="8" fill="#FFFFFF" stroke="#D7D3CC"/>
  <text x="896" y="476" class="navy" font-size="20" font-weight="700">Parquet output</text>
  <text x="896" y="518" class="muted small">A background writer saves</text>
  <text x="896" y="545" class="muted small">predictions while the GPU</text>
  <text x="896" y="572" class="muted small">scores the next batch.</text>

  <rect x="48" y="644" width="1104" height="74" rx="8" fill="#0B2026"/>
  <text x="72" y="675" fill="#FFFFFF" font-size="19" font-weight="600">Repeat the comparison with the Databricks AI Runtime skill</text>
  <text x="72" y="702" fill="#D7E1E5" font-size="16">Build and push the Docker image, validate the workload, and compare throughput in MLflow.</text>

  <text x="48" y="746" class="muted" font-size="15">The cold pass fills the local cache. The warm pass reuses the cached files and writes predictions.</text>
</svg>
