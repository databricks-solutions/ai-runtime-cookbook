experiment_name: air-object-detection-autolabel-rf-detr

environment:
  version: "5"
  dependencies:
    # RF-DETR 1.12.1 requires transformers 5.1 or newer. transformers 5.20.2 also loads the OWLv2 detector.
    - rfdetr[train]==1.12.1
    - transformers==5.20.2
    - huggingface_hub==2.4.0
    # RF-DETR's own COCO evaluator backend. Used directly here so the labeler and RF-DETR share one mAP implementation.
    - faster-coco-eval==1.7.2

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  root_path: .

command: |
  # AIR may inherit this obsolete setting; Hub 1.x uses Xet for downloads.
  unset HF_HUB_ENABLE_HF_TRANSFER
  # rfdetr[train] installs roboflow, which requires opencv-python-headless. Its manylinux_2_28 wheel aborts with
  # "FATAL FIPS SELFTEST FAILURE" on AI Runtime. This recipe never imports cv2; supervision and RF-DETR import it
  # only when present, so remove it.
  python -m pip uninstall -y opencv-python-headless opencv-python || true
  python "$CODE_SOURCE_PATH/train.py"

max_retries: 0
timeout_minutes: 60

parameters:
  # Open-vocabulary auto-labeler. Apache-2.0 and ungated.
  detector_model: google/owlv2-base-patch16-ensemble
  detector_revision: cfd3195ba4ea9592eec887ded089f4c08eff231d
  detector_batch_size: 8
  # Class names are text prompts for the detector. Order must match the dataset's category indices (0 luggage, 1 person).
  class_names: [luggage, person]
  # Candidate confidence thresholds. The validation split picks one; the test split is never used for selection.
  threshold_grid: [0.05, 0.1, 0.15, 0.2, 0.3, 0.4, 0.5]
  nms_iou: 0.5

  # Public, ungated, CC BY 4.0 dataset with human boxes and train/validation/test splits.
  dataset_repo: abhinand4as/people-luggage-detection
  dataset_revision: 6d9506f2e49b64a00e13225139e9aa4eed49f106

  # RF-DETR variant: nano or small (both Apache-2.0).
  rfdetr_model: nano
  epochs: 15
  batch_size: 16
  learning_rate: 0.0001
  seed: 42
  # Upper bound: also train on the human train labels. Off by default to keep the run short.
  train_on_human_labels: false

  # Scratch space for downloads and staged datasets. Not persisted across stop/start.
  data_root: /tmp/object-detection-autolabel-rf-detr
  # Requires access to this existing volume; replace it with another writable volume if needed.
  output_root: /Volumes/main/default/air_examples/object-detection-autolabel-rf-detr
