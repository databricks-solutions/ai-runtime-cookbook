experiment_name: sft-qwen2-5-0-5b-lora-serving

environment:
  version: databricks_ai_v6

compute:
  num_accelerators: 1
  accelerator_type: GPU_1xA10

code_source:
  root_path: .

command: |
  cd "$CODE_SOURCE_PATH"
  python train.py

max_retries: 0
timeout_minutes: 30

parameters:
  model_name: Qwen/Qwen2.5-0.5B-Instruct
  dataset_name: tatsu-lab/alpaca
  train_examples: 64
  eval_examples: 16
  max_steps: 16
  max_train_minutes: 8
  learning_rate: 0.0002
  max_length: 1024
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  # Requires access to this existing volume; replace it with another writable volume if needed.
  output_root: /Volumes/main/default/air_examples/sft-qwen2.5-0.5b-lora-serving
