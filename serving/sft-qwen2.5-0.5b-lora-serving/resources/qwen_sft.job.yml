resources:
  jobs:
    qwen_sft:
      name: Qwen 0.5B SFT and serving
      max_concurrent_runs: 1
      environments:
        - environment_key: ai_v6
          spec:
            base_environment: databricks_ai_v6
            dependencies:
              - ninja==1.11.1.4
        - environment_key: cpu
          spec:
            environment_version: '4'
            dependencies:
              - databricks-sdk==0.102.0
      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../train_job.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.schema}
              uc_model_name: ${var.model_name}
          environment_key: ai_v6
          compute:
            hardware_accelerator: GPU_1xA10
          max_retries: 0
          timeout_seconds: 1800
        - task_key: deploy
          depends_on:
            - task_key: train
          notebook_task:
            notebook_path: ../deploy.py
            base_parameters:
              uc_catalog: ${var.catalog}
              uc_schema: ${var.schema}
              uc_model_name: ${var.model_name}
              model_version: '{{tasks.train.values.model_version}}'
              endpoint_name: ${var.endpoint_name}
          environment_key: cpu
          max_retries: 0
          timeout_seconds: 5400
