experiment_name: ray-train-hello-world

# databricks_ai_v6 provides Ray 2.56 (with the default, Train, and Tune extras) and PyTorch.
environment:
  version: databricks_ai_v6

compute:
  num_accelerators: 2
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - ray_bootstrap.sh
      - train

command: |
  cd "$CODE_SOURCE_PATH"
  RAY_ENTRYPOINT=train/hello_world.py bash ray_bootstrap.sh

max_retries: 0
timeout_minutes: 15
