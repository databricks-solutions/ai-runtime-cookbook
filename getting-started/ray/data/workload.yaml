experiment_name: ray-data-hello-world

environment:
  version: "5"
  dependencies:
    - "ray[data]==2.56.1"

compute:
  num_accelerators: 2
  accelerator_type: GPU_1xA10

code_source:
  type: snapshot
  snapshot:
    root_path: ..
    include_paths:
      - ray_bootstrap.sh
      - data

command: |
  cd "$CODE_SOURCE_PATH"
  RAY_ENTRYPOINT=data/hello_world.py bash ray_bootstrap.sh

max_retries: 0
timeout_minutes: 15

env_variables:
  # Ray 2.56's default Ray Data autoscaler reports no resources until its coordinator
  # first responds, so short pipelines run one task at a time and warn that they may
  # hang. V1 avoids that, but it is deprecated and prints a RayDeprecationWarning;
  # remove this setting when upgrading Ray past 2.56.1.
  RAY_DATA_CLUSTER_AUTOSCALER: "V1"
