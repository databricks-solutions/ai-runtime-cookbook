experiment_name: ray-tune-hello-world

# databricks_ai_v6 provides Ray 2.56 (with the default, Train, and Tune extras) and PyTorch 2.11 (CUDA 13).
environment:
  version: databricks_ai_v6

compute:
  num_accelerators: 4
  accelerator_type: GPU_1xA10

code_source:
  root_path: ..
  include_paths:
    - ray_bootstrap.sh
    - tune

command: |
  cd "$CODE_SOURCE_PATH"
  RAY_ENTRYPOINT=tune/hello_world.py bash ray_bootstrap.sh

max_retries: 0
timeout_minutes: 30
